<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Principal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header style="background: #1e293b; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;">

        <div>

        <nav style="display: flex; gap: 15px; flex-wrap: wrap;">
            <a href="produtos.html" style="flex: 1; min-width: 180px; padding: 15px; background-color: #2563eb; color: white; text-decoration: none; border-radius: 6px; text-align: center; font-weight: bold;">

            </a>
            <a href="estoque.html" style="flex: 1; min-width: 180px; padding: 15px; background-color: #059669; color: white; text-decoration: none; border-radius: 6px; text-align: center; font-weight: bold;">

            </a>
            <a href="historico.html" style="flex: 1; min-width: 180px; padding: 15px; background-color: #4f46e5; color: white; text-decoration: none; border-radius: 6px; text-align: center; font-weight: bold;">
                📜 Histórico
            </a>
        </nav>

    <script src="script.js"></script>

</html>
