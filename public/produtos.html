<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Produtos - Gestão de Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Gestão de Produtos</h1>
        <a href="dashboard.html" style="color:white;">Voltar</a>
    </header>
    <div class="container">
        <h3>Cadastrar Novo Produto</h3>
        <form id="formProduto">
            <div>
                <label>Nome do Produto:</label>
                <input type="text" id="prodNome" required>
            </div>
            <div style="display: flex; gap: 10px;">
                <div style="flex:1;">
                    <label>Qtd Inicial:</label>
                    <input type="number" id="prodQtd" value="0" required>
                </div>
                <div style="flex:1;">
                    <label>Estoque Mínimo:</label>
                    <input type="number" id="prodMinimo" value="0" required>
                </div>
            </div>
            <button type="submit" style="margin-top: 10px;">Cadastrar Produto</button>
        </form>

        <hr style="margin: 30px 0;">

        <h3>Produtos Cadastrados</h3>
        <input type="text" id="inputBusca" placeholder="Pesquisar produto pelo nome..." onkeyup="carregarProdutos()">
        
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Qtd Atual</th>
                    <th>Qtd Mínima</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaProdutos"></tbody>
        </table>
    </div>
    <script src="script.js"></script>
    <script>carregarProdutos();</script>
</body>
</html>
