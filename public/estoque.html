<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Movimentação de Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Movimentar Estoque</h1>
        <a href="dashboard.html" style="color:white;">Voltar</a>
    </header>
    <div class="container">
        <h3>Registrar Entrada / Saída</h3>
        <form id="formMovimentar">
            <div>
                <label>Selecione o Produto:</label>
                <select id="selectProduto" required></select>
            </div>
            <div>
                <label>Tipo de Operação:</label>
                <select id="tipoOperacao" required>
                    <option value="ENTRADA">Entrada (+)</option>
                    <option value="SAIDA">Saída (-)</option>
                </select>
            </div>
            <div>
                <label>Quantidade:</label>
                <input type="number" id="movQuantidade" min="1" required>
            </div>
            <button type="submit" style="margin-top: 10px;">Confirmar Movimentação</button>
        </form>
    </div>
    <script src="script.js"></script>
    <script>carregarSelectProdutos();</script>
</body>
</html>
